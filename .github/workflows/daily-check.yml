name: Daily Insider Check

on:
  schedule:
    # GitHub cron uses UTC. 07:00 UTC = 15:00 Asia/Shanghai.
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers; leave blank to use the default stock list"
        required: false
        default: ""

      threshold:
        description: "Minimum trade size in USD; leave blank to use 40000"
        required: false
        default: ""

      lookback:
        description: "Days to look back; leave blank to use 4"
        required: false
        default: ""

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DING_WEBHOOK_URL: ${{ secrets.DING_WEBHOOK_URL }}
  DING_WEBHOOK_SIGN: ${{ secrets.DING_WEBHOOK_SIGN }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}

  STOCK_LIST: "美股"

  TICKERS: ${{ github.event.inputs.tickers || '' }}

  THRESHOLD_USD: ${{ github.event.inputs.threshold || '40000' }}

  LOOKBACK_DAYS: ${{ github.event.inputs.lookback || '4' }}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -v

      - name: Show run parameters
        run: |
          echo "STOCK_LIST=${STOCK_LIST}"
          echo "TICKERS=${TICKERS}"
          echo "THRESHOLD_USD=${THRESHOLD_USD}"
          echo "LOOKBACK_DAYS=${LOOKBACK_DAYS}"

      - name: Run bot
        run: |
          if [ -n "${TICKERS}" ]; then
            python stock_insider_bot.py --tickers="${TICKERS}" \
              --threshold="${THRESHOLD_USD}" \
              --lookback="${LOOKBACK_DAYS}"
          else
            python stock_insider_bot.py --stock-list="${STOCK_LIST}" \
              --threshold="${THRESHOLD_USD}" \
              --lookback="${LOOKBACK_DAYS}"
          fi
