name: Daily Insider Check

on:
  schedule:
    # GitHub cron uses UTC. 07:00 UTC = 15:00 Asia/Shanghai.
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      stock_list:
        description: "Stock list file name in the repository"
        required: false
        default: "美股"

      tickers:
        description: "Optional comma-separated ticker override"
        required: false
        default: ""

      threshold:
        description: "Minimum trade size in USD"
        required: false
        default: "200000"

      lookback:
        description: "Days to search back for a valid SEC master index"
        required: false
        default: "3"

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DING_WEBHOOK_URL: ${{ secrets.DING_WEBHOOK_URL }}
  DING_WEBHOOK_SIGN: ${{ secrets.DING_WEBHOOK_SIGN }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}

  STOCK_LIST: ${{ github.event.inputs.stock_list || '美股' }}

  TICKERS: ${{ github.event.inputs.tickers || '' }}

  THRESHOLD_USD: ${{ github.event.inputs.threshold || '200000' }}

  LOOKBACK_DAYS: ${{ github.event.inputs.lookback || '3' }}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -v

      - name: Run bot
        run: |
          if [ -n "${TICKERS}" ]; then
            python stock_insider_bot.py --tickers="${TICKERS}" \
              --threshold="${THRESHOLD_USD}" \
              --lookback="${LOOKBACK_DAYS}"
          else
            python stock_insider_bot.py --stock-list="${STOCK_LIST}" \
              --threshold="${THRESHOLD_USD}" \
              --lookback="${LOOKBACK_DAYS}"
          fi
